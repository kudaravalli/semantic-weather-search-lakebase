bundle:
  name: weather-asst

# ----------------------------------------------------------------------
# Variables
# ----------------------------------------------------------------------
variables:
  lakebase_project:
    description: "Lakebase project name"
  lakebase_branch:
    description: "Lakebase branch name"
    default: "main"
  weather_schema:
    description: "Weather data schema/database name"
    default: "weather"

# ----------------------------------------------------------------------
# Deployment targets
# ----------------------------------------------------------------------
targets:
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      lakebase_project: "weather"
      weather_schema: "weather"

# ----------------------------------------------------------------------
# Databricks App Resource (commented out - deploy manually)
# ----------------------------------------------------------------------
# resources:
#   apps:
#     weather_app:
#       name: weather-asst-${workspace.current_user.domain_friendly_name}
#       description: Weather RAG Assistant with Lakebase
#       source_code_path: .

# ----------------------------------------------------------------------
# Jobs
#
# These files are deployed as part of the bundle.
#
# ----------------------------------------------------------------------
resources:
include:
  - resources/*.yml

# ----------------------------------------------------------------------
# Repository synchronization
# ----------------------------------------------------------------------
sync:
  include:
    - app.py
    - app.yaml
    - embedding/**
    - lakebase.py
    - weather_client.py
    - weather_sync.py
    - weather_schema.py
    - requirements.txt
    - notebooks/**
    - templates/**

