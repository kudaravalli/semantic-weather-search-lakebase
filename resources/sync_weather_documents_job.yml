#
# Weather document synchronization job
#
# Deploy:
#
#   databricks bundle deploy -t dev
#
#
# Run manually:
#
#   databricks bundle run sync_weather_documents_job -t dev
#
#


resources:


  jobs:


    sync_weather_documents_job:


      name: "[${bundle.target}] Sync Weather Documents"



      # --------------------------------------------------------------
      # Schedule
      #
      # Runs every 15 minutes.
      #
      # Weather alerts can change quickly, so this is more frequent
      # than the embedding pipeline.
      #
      # --------------------------------------------------------------

      schedule:

        quartz_cron_expression: "0 */15 * * * ?"

        timezone_id: "UTC"

        pause_status: PAUSED
        #
        # Change to UNPAUSED after validation.
        #



      email_notifications:

        on_failure:

          - ${workspace.current_user.userName}



      max_concurrent_runs: 1



      # --------------------------------------------------------------
      # Environment (for serverless)
      # --------------------------------------------------------------

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - psycopg>=3.3,<4
              - sentence-transformers>=3.0.1
              - sqlalchemy>=2.0.30
              - databricks-sdk>=0.30.0
              - requests>=2.32.3
              - python-dotenv>=1.0.1


      # --------------------------------------------------------------
      # Task
      # --------------------------------------------------------------

      tasks:


        - task_key: sync_weather_documents

          environment_key: default

          notebook_task:
            notebook_path: ../notebooks/sync_weather_documents_nb.py
            base_parameters:
              lakebase_project: "${var.lakebase_project}"
              lakebase_branch: "${var.lakebase_branch}"
              weather_table_name: "${var.weather_schema}.weather_documents"
              location_cache_table_name: "${var.weather_schema}.location_cache"
              locations_json: '["Chicago, IL", "Austin, TX", {"lat": 37.7749, "lon": -122.4194}, {"lat": 40.7128, "lon": -74.0060}]'
              alert_limit: "50"
              forecast_limit: "50"



