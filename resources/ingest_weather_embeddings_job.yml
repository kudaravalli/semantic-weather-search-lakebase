#
# Weather embedding ingestion job
#
# Deploy:
#
#   databricks bundle deploy -t dev
#
#
# Run manually:
#
#   databricks bundle run ingest_weather_embeddings_job -t dev
#
#

resources:


  jobs:


    ingest_weather_embeddings_job:


      name: "[${bundle.target}] Ingest Weather Embeddings"




      # --------------------------------------------------------------
      # Schedule
      #
      # Runs daily after weather documents have accumulated.
      #
      # --------------------------------------------------------------

      schedule:


        quartz_cron_expression: "0 30 6 * * ?"


        timezone_id: "UTC"


        pause_status: UNPAUSED

        #
        # Change to UNPAUSED after validation.
        #





      email_notifications:


        on_failure:


          - ${workspace.current_user.userName}





      max_concurrent_runs: 1


      # --------------------------------------------------------------
      # Environment (for serverless)
      # --------------------------------------------------------------

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - psycopg>=3.3,<4
              - sentence-transformers>=3.0.1
              - sqlalchemy>=2.0.30
              - databricks-sdk>=0.30.0
              - requests>=2.32.3
              - python-dotenv>=1.0.1
              - sentence-transformers>=3.0.1
              - torch>=2.3.1
              - numpy>=1.26.4
              - pandas>=2.2.2


      # --------------------------------------------------------------
      # Task
      # --------------------------------------------------------------

      tasks:


        - task_key: ingest_weather_embeddings

          environment_key: default

          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings_nb.py
            base_parameters:
              lakebase_project: "${var.lakebase_project}"
              lakebase_branch: "${var.lakebase_branch}"
              weather_table_name: "${var.weather_schema}.weather_documents"
              embeddings_table_name: "${var.weather_schema}.weather_embeddings"
              alert_embeddings_table_name: "${var.weather_schema}.weather_alert_embeddings"
              forecast_embeddings_table_name: "${var.weather_schema}.weather_forecast_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              chunk_size: "800"
              chunk_overlap: "100"
              max_documents_per_run: "5000"
              incremental_mode: "true"

